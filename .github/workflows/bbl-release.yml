name: BBL release build

# Builds a Bambu-enabled OrcaSlicer installer by replaying danielwoz's my_orca
# BBL commit stack (the code behind his working 2.4.0-beta-bbl3 build) onto an
# OFFICIAL OrcaSlicer release tag, then letting the fork's inherited
# build_all.yml compile it.
#
# Trigger it manually ("Run workflow"). Official releases are infrequent, so
# clicking Run when a new one lands is the intended flow. A best-effort daily
# schedule is included, but GitHub disables scheduled runs on forks until you
# enable them, so do not rely on it.
#
# NOTE: danielwoz's stack is a ~24-commit fork, not a clean patch. On releases
# where it does not apply cleanly this job stops at the conflict and asks you to
# resolve locally with scripts/bbl-rebase.sh, then push the branch yourself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Official OrcaSlicer release tag (blank = latest official release, e.g. v2.4.2)'
        required: false
        type: string
      dwoz_ref:
        description: "danielwoz source to take BBL commits from (a tag/commit on his my_orca line)"
        required: false
        default: 'v2.4.0-beta-bbl3'
        type: string
      force:
        description: 'Rebuild even if release/bbl-<tag> already exists'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * *'   # best-effort; often disabled by GitHub on forks

permissions:
  contents: write

concurrency:
  group: bbl-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target release tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IN='${{ github.event.inputs.tag }}'
          if [ -n "$IN" ]; then
            TAG="$IN"
          else
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/latest | jq -r '.tag_name')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "branch=release/bbl-$TAG" >> "$GITHUB_OUTPUT"
          echo "Target: $TAG -> release/bbl-$TAG"

      - name: Gate on existing branch
        id: gate
        env:
          BR: ${{ steps.pick.outputs.branch }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then echo "already=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BR" >/dev/null 2>&1; then
            echo "already=true"  >> "$GITHUB_OUTPUT"
            echo "Branch $BR exists; set force=true to rebuild."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replay danielwoz's BBL stack onto the release
        if: steps.gate.outputs.already == 'false'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          DWOZ_REF: ${{ github.event.inputs.dwoz_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DWOZ_REF="${DWOZ_REF:-v2.4.0-beta-bbl3}"
          git config --global user.name  "bbl-bot"
          git config --global user.email "bbl-bot@users.noreply.github.com"

          # Full clone of the fork so cherry-pick has the base blobs it needs.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
          cd work
          git remote add upstream https://github.com/OrcaSlicer/OrcaSlicer.git
          git remote add dwoz     https://github.com/danielwoz/OrcaSlicer.git
          echo "Fetching upstream tags and danielwoz source '${DWOZ_REF}' (full history for merge-base)..."
          git fetch --quiet --tags upstream
          git fetch --quiet dwoz "refs/tags/${DWOZ_REF}:refs/tags/${DWOZ_REF}" 2>/dev/null \
            || git fetch --quiet dwoz "${DWOZ_REF}"
          DWOZ_TIP=$(git rev-parse "${DWOZ_REF}^{commit}")

          MB=$(git merge-base "$DWOZ_TIP" "refs/tags/${TAG}")
          echo "merge-base(dwoz, ${TAG}) = $MB"
          mapfile -t COMMITS < <(git rev-list --reverse --author="danielwoz" "$MB..$DWOZ_TIP")
          echo "danielwoz commits to replay: ${#COMMITS[@]}"
          [ "${#COMMITS[@]}" -gt 0 ] || { echo "::error::no danielwoz commits found on ${DWOZ_REF}"; exit 1; }

          git checkout -B "$BRANCH" "refs/tags/${TAG}"
          if ! git cherry-pick -x "${COMMITS[@]}"; then
            echo "::error title=Conflict::danielwoz's stack does not apply cleanly onto ${TAG}."
            echo "Resolve locally: scripts/bbl-rebase.sh ${TAG} ${DWOZ_REF}  (then push release/bbl-${TAG})."
            git cherry-pick --abort || true
            exit 1
          fi

          git push -f origin "$BRANCH"
          echo "::notice::Pushed ${BRANCH} (${#COMMITS[@]} commits). The inherited 'Build all' will build the installer."
