name: Build all

# BBL fork override: build ONLY Windows x64 (the platform this fork targets).
# Reuses OrcaSlicer's own build_check_cache.yml -> build_orca.yml chain, so the
# build itself is unchanged; we just drop the macOS/Linux/Flatpak/Win-arm64/
# unit-test jobs that the upstream build_all.yml would otherwise run.

on:
  push:
    branches:
      - 'release/bbl-*'
  workflow_dispatch:

concurrency:
  group: bbl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      build-deps-only: false
      force-build: false
    secrets: inherit
